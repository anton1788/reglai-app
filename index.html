      - dev  → vite.config.js (server.headers)
      - prod → vercel.json
      Meta-тег НЕ используется, чтобы не ослаблять политику.
    -->

    <link rel="preload" href="/icon-192.png" as="image" />
    <link rel="preload" href="/icon-512.png" as="image" />

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      #root-skeleton {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f9fafb;
        transition: opacity 0.3s ease-in-out;
      }
      .dark #root-skeleton {
        background: #0f172a;
      }
      .skeleton-content {
        text-align: center;
        max-width: 400px;
        padding: 20px;
      }
      .skeleton-loader {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
      .skeleton-title {
        color: #1f2937;
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px 0;
        line-height: 1.3;
      }
      .dark .skeleton-title {
        color: #f1f5f9;
      }
      .skeleton-subtitle {
        color: #6b7280;
        font-size: 14px;
        margin: 0;
        line-height: 1.4;
      }
      .dark .skeleton-subtitle {
        color: #94a3b8;
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton-loader {
          animation: none;
          opacity: 0.7;
        }
      }
      .app-loaded #root-skeleton {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-skeleton">
        <div class="skeleton-content">
          <div class="skeleton-loader"></div>
          <h1 class="skeleton-title">Загрузка Реглай...</h1>
          <p class="skeleton-subtitle">Система управления заявками на материалы</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.updateThemeColor = function (isDark) {
        const meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', isDark ? '#1e293b' : '#3b82f6');
        }
        const appleMeta = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        );
        if (appleMeta) {
          appleMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
        }
      };
    </script>

    <script nomodule>
      document.getElementById('root').innerHTML = `
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; color: #333; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">

      `;
