    <link rel="manifest" href="/manifest.json?v=3.26" crossorigin="use-credentials" />

    <!-- 🔹 Theme color: адаптация под светлую/тёмную тему -->
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#3b82f6" id="theme-color-meta" />

    <!-- 🔹 Preconnect к доменам -->
    <link rel="preconnect" href="https://*.supabase.co" crossorigin />
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
    <link rel="dns-prefetch" href="https://fnrzwatvrqldwdikdnew.supabase.co" />
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />

    <!-- 🔹 Кэширование и производительность -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- ═══════════════════════════════════════════════════════════
         🔹 БЕЗОПАСНОСТЬ: Content Security Policy
         ═══════════════════════════════════════════════════════════
         ⚠️ Этот мета-тег ИМЕЕТ ПРИОРИТЕТ над HTTP-заголовком из vite.config.js.
            Всё, что описано здесь — это финальный CSP, который получает браузер.

         ✅ Добавлено: cdn.tailwindcss.com в script-src и style-src
            (для предпросмотра HTML-документов в iframe через srcDoc)
         ✅ Добавлено: about: и blob: в frame-src и child-src
            (iframe с srcDoc получает URL about:srcdoc, который НЕ попадает под 'self')
         ✅ Добавлено: object-src для встроенного PDF-вьюера Chrome/Edge
            (иначе fallback на default-src 'self' блокирует плагин просмотра PDF)
         ✅ Добавлено: base-uri и form-action для защиты от инъекций
         ═══════════════════════════════════════════════════════════ -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://*.supabase.co https://*.supabase.storage; media-src 'self' blob: data: https://*.supabase.co https://*.supabase.storage; connect-src 'self' https://*.supabase.co https://*.supabase.rest https://*.supabase.storage https://*.supabase.auth https://cdn.tailwindcss.com wss://*.supabase.co ws://localhost:* http://localhost:*; manifest-src 'self'; frame-src 'self' about: blob: https://*.supabase.co https://*.supabase.storage; child-src 'self' about: blob: https://*.supabase.co; object-src 'self' blob: https://*.supabase.co https://*.supabase.storage; worker-src 'self' blob:; base-uri 'self'; form-action 'self'"
    />

    <!-- 🔹 Preload критических ресурсов для ускорения загрузки -->
    <link rel="preload" href="/icon-192.png" as="image" />
    <link rel="preload" href="/icon-512.png" as="image" />

    <!-- 🔹 Service Worker registration status (для отладки) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .ready
            .then(function (registration) {
              console.log('[SW] Service Worker готов:', registration);
            })
            .catch(function (err) {
              console.warn('[SW] Ошибка регистрации:', err);
            });
        });
      }
    </script>

    <!-- 🔹 Стили скелетона (инлайн для мгновенной загрузки) -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      #root-skeleton {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f9fafb;
        transition: opacity 0.3s ease-in-out;
      }
      .dark #root-skeleton {
        background: #0f172a;
      }
      .skeleton-content {
        text-align: center;
        max-width: 400px;
        padding: 20px;
      }
      .skeleton-loader {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
      .skeleton-title {
        color: #1f2937;
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px 0;
        line-height: 1.3;
      }
      .dark .skeleton-title {
        color: #f1f5f9;
      }
      .skeleton-subtitle {
        color: #6b7280;
        font-size: 14px;
        margin: 0;
        line-height: 1.4;
      }
      .dark .skeleton-subtitle {
        color: #94a3b8;
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton-loader {
          animation: none;
          opacity: 0.7;
        }
      }
      .app-loaded #root-skeleton {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Скелетон для лучшего UX при загрузке -->
    <div id="root">
      <div id="root-skeleton">
        <div class="skeleton-content">
          <div class="skeleton-loader"></div>
          <h1 class="skeleton-title">Загрузка Реглай...</h1>
          <p class="skeleton-subtitle">Система управления заявками на материалы</p>
        </div>
      </div>
    </div>

    <!-- Основной скрипт приложения -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- 🔹 Минимальный скрипт: только updateThemeColor -->
    <script>
      window.updateThemeColor = function (isDark) {
        const meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', isDark ? '#1e293b' : '#3b82f6');
        }
        const appleMeta = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        );
        if (appleMeta) {
          appleMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
        }
      };
    </script>

    <!-- 🔹 Фолбэк для старых браузеров без поддержки модулей -->
    <script nomodule>
      document.getElementById('root').innerHTML = `
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; color: #333; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">
          <div>
            <h2 style="font-size: 24px; margin-bottom: 16px; color: #dc2626;">Ваш браузер устарел</h2>
            <p style="margin-bottom: 24px; color: #6b7280;">Пожалуйста, обновите браузер до последней версии для работы с Реглай.</p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
              <a href="https://www.google.com/chrome/" target="_blank" rel="noopener" style="background: #4285f4; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;">
                Chrome

                Edge
              </a>
            </div>
          </div>
        </div>
      `;
    </script>
  </body>
